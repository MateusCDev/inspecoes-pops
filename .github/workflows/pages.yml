name: Publicar aplicação no GitHub Pages
on:
  push:
    branches: [main]
    paths: ['public/**', 'tools/prepare-pages.cjs', 'tools/refresh-fttx-prices.cjs', 'tools/fttx-sources.json', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Atualizar referências públicas do levantamento FTTx
        run: node tools/refresh-fttx-prices.cjs --previous
      - name: Identificar a versão dos arquivos estáticos
        run: node tools/prepare-pages.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Aguardar disponibilidade do pacote
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'github-pages-' + context.runId + '-' + process.env.GITHUB_RUN_ATTEMPT;
            for (let attempt = 0; attempt < 15; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId, per_page: 100
              });
              if (data.artifacts.some(item => item.name === artifactName && !item.expired)) return;
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            core.setFailed('O pacote da publicação ainda não está disponível no GitHub.');
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
