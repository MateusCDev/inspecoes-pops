name: Publicar aplicação no GitHub Pages
on:
  push:
    branches: [main]
    paths: ['public/**', 'tools/prepare-pages.cjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Identificar a versão dos arquivos estáticos
        run: node tools/prepare-pages.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Aguardar o pacote ficar disponível para publicação
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.expired == false) | .name')
            if grep -Fxq github-pages <<< "$names"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
