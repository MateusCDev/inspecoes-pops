*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--accent)}.app{display:flex;min-height:100vh}.sidebar{width:247px;background:var(--nav);color:#fff;padding:24px 13px;position:sticky;top:0;height:100vh;flex-shrink:0}.brand{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:5px 10px 24px;font-weight:800;font-size:20px}.brand img{width:190px;height:auto;display:block;max-width:100%}.brand small{display:block;font-size:10px;letter-spacing:1.2px;color:#ffd5d7;font-weight:700;text-transform:uppercase}.nav{display:flex;flex-direction:column;gap:5px}.nav button{background:transparent;color:#d9dce1;text-align:left;border:1px solid transparent;border-radius:9px;padding:12px 14px;display:flex;align-items:center;gap:12px}.nav button:hover,.nav button.active{background:#351518;color:white;border-color:#5b1f24;box-shadow:inset 3px 0 0 var(--accent)}.nav .ic{font-size:18px;min-width:24px}.sidebar-bottom{position:absolute;bottom:25px;left:22px;right:22px;color:#b5bbc3;font-size:11px}.content{flex:1;min-width:0;padding:30px clamp(16px,3vw,52px);max-width:1550px;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:25px}.eyebrow{font-size:11px;letter-spacing:1.2px;font-weight:800;color:#b42318;text-transform:uppercase}.top h1{font-size:28px;line-height:1.2;margin:4px 0}.sub{color:var(--muted)}.right{display:flex;gap:9px;flex-wrap:wrap}.btn{background:var(--accent);color:white;border:1px solid var(--accent);border-radius:9px;padding:9px 15px;font-weight:650}.btn:hover{filter:brightness(.94)}.btn.secondary{background:#fff;color:var(--accent);border-color:#efb0b4}.btn.danger{background:#fff;color:var(--danger);border-color:#efc0bc}.btn.small{padding:6px 10px;font-size:12px}.btn:disabled{opacity:.48;cursor:not-allowed}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.metric{padding:22px}.metric strong{font-size:29px;display:block;margin:6px 0 0}.metric span{color:var(--muted)}.layout2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.panel{padding:22px;margin-bottom:18px}.panel h2{font-size:17px;margin:0 0 14px}.panel h3{font-size:14px;margin:0 0 12px}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-grid .wide{grid-column:1/-1}label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#506177;font-weight:700}input,select,textarea{border:1px solid #cbd6e4;background:white;border-radius:8px;color:var(--ink);padding:10px;width:100%;min-width:0}textarea{min-height:76px;resize:vertical}.help{color:var(--muted);font-size:12px}.pill{border-radius:99px;font-size:11px;font-weight:750;padding:4px 9px;background:#eef2f7;color:#56667a;display:inline-block}.pill.green{background:#e5f6ee;color:#117b52}.pill.red{background:#fce9e9;color:#a63239}.pill.yellow{background:#fff4da;color:#95610d}.pill.blue{background:#e7f1ff;color:#1857a1}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:12px 9px;vertical-align:middle}th{font-size:11px;color:#607187;text-transform:uppercase;letter-spacing:.4px}tr:last-child td{border:0}.empty{text-align:center;padding:50px 15px;color:#73869d}.empty b{display:block;color:var(--ink);margin-bottom:5px}.card-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border-bottom:1px solid var(--line)}.card-row:last-child{border:0}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:10px;margin-bottom:9px}.tabs button{background:white;border:1px solid var(--line);border-radius:22px;padding:7px 12px;white-space:nowrap;color:#51647c}.tabs button.active{background:var(--accent);border-color:var(--accent);color:white}.check-row{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #e8edf4}.check-row:last-child{border:0}.check-row select{padding:7px}.image-preview{height:110px;max-width:200px;object-fit:cover;border:1px solid var(--line);border-radius:8px;margin-top:7px}.photo-icon{font-size:23px}.section-label{background:#f0f5fa;border-radius:8px;padding:9px 12px;font-weight:800;margin:20px 0 6px}.banner{background:#fff6df;border:1px solid #f2dba3;color:#80540c;padding:12px 15px;border-radius:10px;font-size:13px;margin-bottom:20px}.banner.blue{background:#edf5ff;border-color:#cbdff8;color:#2b527b}.small-muted{font-size:11px;color:var(--muted)}.alert{border-left:3px solid var(--warn);padding:10px 12px;background:#fff9e8;border-radius:6px;margin:8px 0}.bar{height:12px;background:#e8edf4;border-radius:20px;overflow:hidden;display:flex}.bar span{height:100%}.modalwrap{position:fixed;inset:0;background:#0d2137b0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal{background:#fff;border-radius:16px;width:min(750px,100%);max-height:93vh;overflow:auto;padding:25px;box-shadow:0 12px 60px #0004}.modal h2{margin:0 0 14px}.close{float:right;border:0;background:#ecf1f7;border-radius:7px;padding:6px 11px}.muted-bg{background:#f4f7fa;border:1px solid #e3eaf2;padding:12px;border-radius:9px}.space{margin-top:16px}.hide{display:none!important}.danger-text{color:var(--danger)}@media(max-width:1050px){.metrics{grid-template-columns:repeat(2,1fr)}.layout2{grid-template-columns:1fr}.sidebar{width:77px;padding:20px 8px}.brand{justify-content:center;padding:6px 0 28px}.brand span,.nav .nav-text,.sidebar-bottom{display:none}.nav button{justify-content:center;padding:12px 4px}.nav .ic{font-size:23px}}
@media(max-width:640px){.app{display:block}.sidebar{position:fixed;top:auto;bottom:0;height:64px;width:100%;z-index:10;padding:5px;background:var(--nav)}.brand,.sidebar-bottom{display:none}.nav{flex-direction:row;justify-content:space-around;overflow-x:auto}.nav button{min-width:48px;padding:8px}.nav .ic{font-size:22px}.content{padding:19px 12px 90px}.top h1{font-size:22px}.top{align-items:flex-start}.metrics{gap:9px}.metric{padding:14px}.metric strong{font-size:24px}.panel{padding:15px}.form-grid{grid-template-columns:1fr}.check-row{grid-template-columns:1fr;gap:5px}.modal{padding:16px}.right{gap:5px}.right .btn{padding:7px 10px}}

.brand{padding:6px 10px 24px;gap:12px}.brand img{background:#fff;border-radius:8px;padding:9px;width:100%;max-width:205px}.brand small{color:#dadce1;letter-spacing:.8px;font-size:10px}.sidebar{overflow-y:auto}.sidebar-bottom{position:static;margin:28px 10px 12px;color:#bfc3cb}.nav button.active{background:#48252a;border-color:#633137;box-shadow:inset 3px 0 0 #f5424a}.nav button:hover{background:#34353d}.btn{min-height:40px;transition:background .12s,border-color .12s}.btn:hover{background:#aa1520;border-color:#aa1520;filter:none}.btn.secondary{color:#343943;border-color:#d1d5dc;background:#fff}.btn.secondary:hover{color:#a91520;border-color:#c91c27;background:#fff4f4}.btn.danger{color:#a12222;border-color:#e9b8b8;background:#fff}.btn.danger:hover{background:#fceaea;border-color:#a12222}.btn.small{min-height:34px}.btn:disabled{opacity:.5}.btn:focus-visible,.nav button:focus-visible,.tabs button:focus-visible,.close:focus-visible{outline:3px solid #ad1823;outline-offset:3px}.nav button:focus-visible{outline-color:#ffafb2}input:focus,select:focus,textarea:focus{outline:2px solid #c91c27;outline-offset:1px}.panel,.metric{border-radius:12px}.metric{border-top:3px solid #c91c27}.metric strong{font-variant-numeric:tabular-nums}.section-label{background:#f5f5f6;border-left:3px solid #c91c27;color:#343943}.banner.blue{background:#f1f2f5;color:#424b58;border-color:#d9dce2}.eyebrow{color:#a91520}.mobile-brand{display:none}.top h1{letter-spacing:-.5px}.tabs button.active{border-color:#c91c27;background:#c91c27}.empty{color:#626c79}th{background:#f6f7f9;color:#535c68}.modalwrap{background:#171a21a8}.modal{border-top:4px solid #c91c27}.close{background:#f1f2f4}.pill.red{background:#fce8e8;color:#9c2027}.pill.yellow{background:#fff3d9;color:#805109}.pill.green{background:#e4f4eb;color:#106a47}

</style><link rel="stylesheet" href="../portal.css?v=__BUILD_ID__"></head><body class="portal-fleet">
<header class="portal-header">
  <div class="portal-bar">
    <a class="portal-brand" href="../"><img src="../voanet.png" alt="VOANET" width="1116" height="229"><span>Infraestrutura</span></a>
    <nav class="portal-tabs" aria-label="Aplicações">
      <a href="../">Inspeções POPs</a>

    </nav>
  </div>
</header>
<div id="root"></div>
<script src="../config.js?v=__BUILD_ID__"></script>
<script>
'use strict';
const CHECK_GROUPS = [
 ['Pneus e rodas',['Pneus dianteiros','Pneus traseiros','Estepe','Rodas e fixação']],
 ['Iluminação',['Faróis','Setas e pisca-alerta','Lanternas e luzes de freio','Luz de ré']],
 ['Segurança e mecânica',['Freios','Direção','Painel e alertas','Vazamentos e fluidos','Cintos de segurança','Limpadores de para-brisa']],
 ['Conservação',['Lataria e para-choques','Vidros e retrovisores','Conservação interna','Ar-condicionado','Limpeza geral']],
 ['Equipamentos e documentos',['Macaco, chave de roda e triângulo','Ferramentas e acessórios','Fixação de escadas e carga','CRLV-e disponível','Cartão de abastecimento disponível','Chaves e acessórios conferidos']]
];
const fresh=()=>({vehicles:[],drivers:[],inspections:[],issues:[],handovers:[],settings:{weeklyDay:1},version:4,audit:[]});
let state=fresh(),page='dashboard',editId=null, draft={}, checkStatuses={},pendingPhotos={},activeVehicle=null;
const $=id=>document.getElementById(id), h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random().toString(16).slice(2);
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const displayDate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);
const vehicle=id=>state.vehicles.find(x=>x.id===id);
const driver=id=>state.drivers.find(x=>x.id===id);
const pill=(t,c='')=>`<span class="pill ${c}">${h(t)}</span>`;
const fileInput=(id,label,existing)=>`<label>${label}<input type="file" id="${id}" accept="image/*,application/pdf"><span class="small-muted">${existing?'Arquivo anexado. Escolha outro para substituir.':'PDF ou foto; armazenamento restrito no Drive.'}</span></label>${existing?.startsWith('data:image/')?`<img class="image-preview" src="${fleetMedia(existing)}">`:''}`;
const f=(id,label,value='',type='text',extra='')=>`<label>${label}<input id="${id}" type="${type}" value="${h(value)}" ${extra}></label>`;
const opts=(arr,chosen,placeholder='Selecione')=>`<option value="">${placeholder}</option>`+arr.map(x=>`<option value="${h(x.id)}" ${x.id===chosen?'selected':''}>${h(x.name)}</option>`).join('');
function notify(msg){let n=document.createElement('div');n.textContent=msg;n.style='position:fixed;right:16px;bottom:78px;background:#11253e;color:white;padding:12px 18px;z-index:50;border-radius:10px;max-width:380px;box-shadow:0 8px 32px #0003';document.body.append(n);setTimeout(()=>n.remove(),3200)}
const menu=[['dashboard','▦','Dashboard'],['vehicles','▣','Veículos'],['drivers','♙','Condutores'],['inspections','☑','Checklists'],['issues','⚠','Avarias'],['handovers','⇄','Devoluções'],['reports','▤','Relatórios'],['audit','◷','Auditoria'],['settings','⚙','Configurações']];
function go(p){
  const fromNavigation=document.activeElement?.matches('.nav button');
  page=p;editId=null;draft={};checkStatuses={};pendingPhotos={};
  render();
  if(fromNavigation)document.querySelector('.nav [aria-current="page"]')?.focus({preventScroll:true});
  scrollTo(0,0);
}
function render(){const tit={dashboard:'Painel da Infraestrutura',vehicles:'Veículos cadastrados',drivers:'Condutores e CNH',inspections:'Checklists veiculares',issues:'Avarias e pendências',handovers:'Entrega e devolução',reports:'Histórico e relatórios',audit:'Histórico de gravações',settings:'Configurações e dados'};
$('root').innerHTML=`<div class="app"><aside class="sidebar"><div class="nav" role="navigation" aria-label="Seções da Frota">${menu.map(([id,ic,name])=>`<button class="${page===id?'active':''}" ${page===id?'aria-current="page"':''} onclick="go('${id}')" title="${name}"><span class="ic" aria-hidden="true">${ic}</span><span class="nav-text">${name}</span></button>`).join('')}</div></aside><main class="content"><header class="top"><div class="top-heading"><h1>${tit[page]}</h1><div class="sub">${new Date().toLocaleDateString('pt-BR')}</div></div><div class="right">${page==='vehicles'?'<button class="btn" onclick="vehicleModal()">+ Veículo</button>':''}${page==='drivers'?'<button class="btn" onclick="driverModal()">+ Condutor</button>':''}${page==='inspections'?'<button class="btn" onclick="inspectionModal()">+ Checklist</button>':''}${page==='handovers'?'<button class="btn" onclick="handoverModal()">+ Devolução / Entrega</button>':''}</div></header><section id="main"></section></main></div><div id="overlay"></div>`;
const screens={dashboard:dashboardScreen,vehicles:vehiclesScreen,drivers:driversScreen,inspections:inspectionsScreen,issues:issuesScreen,handovers:handoversScreen,reports:reportsScreen,audit:auditScreen,settings:settingsScreen};screens[page]();
  const navigation=document.querySelector('.nav'), current=navigation.querySelector('[aria-current="page"]');
  if(current&&navigation.scrollWidth>navigation.clientWidth){
    const item=current.getBoundingClientRect(), bar=navigation.getBoundingClientRect();
    navigation.scrollLeft+=item.left-bar.left+(item.width-bar.width)/2;
  }
}
function lastPeriodic(id){return state.inspections.filter(i=>i.vehicleId===id&&['semanal','quinzenal'].includes(i.type)).sort((a,b)=>b.date.localeCompare(a.date))[0]}
function inspectionStatus(v){let last=lastPeriodic(v.id);if(!last)return ['Sem inspeção','red'];let elapsed=daysBetween(last.date,today());if(elapsed>15)return ['Atrasado','red'];if(elapsed>7)return last.extended?['Prazo excepcional','yellow']:['Atrasado','red'];return ['Em dia','green']}
function licenseStatus(d){if(!d.expiry)return ['Sem validade','red'];let n=daysBetween(today(),d.expiry);return n<0?['Vencida*','red']:n<=30?['Até 30 dias','yellow']:n<=60?['Até 60 dias','yellow']:['Cadastrada','green']}
function dashboardScreen(){let active=state.vehicles.filter(v=>v.status==='Em utilização').length,free=state.vehicles.filter(v=>v.status==='Disponível').length,unavailable=state.vehicles.filter(v=>v.status==='Indisponível').length,late=state.vehicles.filter(v=>inspectionStatus(v)[1]==='red').length,issues=state.issues.filter(i=>i.status!=='Resolvida').length,expiring=state.drivers.filter(d=>licenseStatus(d)[1]!=='green').length;
$('main').innerHTML=`<div class="metrics">${[['Veículos cadastrados',state.vehicles.length],['Em utilização',active],['Disponíveis',free],['Indisponíveis',unavailable]].map(x=>`<div class="metric"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="layout2"><div><div class="panel"><div class="flex between"><h2>Agenda de inspeções</h2><button class="btn small" onclick="go('inspections')">+ Novo checklist</button></div>${state.vehicles.length?state.vehicles.map(v=>{let st=inspectionStatus(v);return `<div class="card-row"><div><b>${h(v.plate)} · ${h(v.model)}</b><div class="help">Última periódica: ${displayDate(lastPeriodic(v.id)?.date)}</div></div>${pill(...st)}</div>`}).join(''):'<div class="empty"><b>Nenhum veículo cadastrado</b>Cadastre um veículo para começar as inspeções.</div>'}</div><div class="panel"><h2>Movimentações recentes</h2>${state.handovers.length?state.handovers.slice().reverse().slice(0,5).map(x=>`<div class="card-row"><div><b>${h(vehicle(x.vehicleId)?.plate||'Veículo removido')}</b><div class="help">${h(x.reason)} · ${displayDate(x.date)}</div></div>${pill(x.confirmed?'Recebido':'Aguardando',x.confirmed?'green':'yellow')}</div>`).join(''):'<div class="help">Nenhuma entrega ou devolução registrada.</div>'}</div></div><div><div class="panel"><h2>Pendências internas</h2><div class="card-row"><span>Checklists sem situação regular</span>${pill(String(late),'red')}</div><div class="card-row"><span>Avarias abertas</span>${pill(String(issues),'yellow')}</div><div class="card-row"><span>CNHs com alerta cadastral</span>${pill(String(expiring),'yellow')}</div><div class="card-row"><span>Devoluções aguardando confirmação</span>${pill(String(state.handovers.filter(x=>!x.confirmed).length),'blue')}</div><p class="help">* CNH vencida sinaliza conferência necessária, não uma decisão jurídica automática sobre autorização para dirigir.</p></div><div class="panel"><h2>Acesso rápido</h2><div class="flex"><button class="btn" onclick="go('inspections')">☑ Inspecionar</button><button class="btn secondary" onclick="go('vehicles')">▣ Veículos</button><button class="btn secondary" onclick="go('handovers')">⇄ Devolver</button></div></div></div></div>`}
function vehiclesScreen(){$('main').innerHTML=`<div class="panel"><h2>Cadastro e situação da frota</h2><div class="table-wrap"><table><thead><tr><th>Placa</th><th>Modelo</th><th>Equipe / Responsável</th><th>Situação</th><th>Checklist</th><th>Ações</th></tr></thead><tbody>${state.vehicles.map(v=>`<tr><td><b>${h(v.plate)}</b></td><td>${h(v.model)}</td><td>${h(v.team||'—')}<div class="help">${h(driver(v.driverId)?.name||'Sem condutor')}</div></td><td>${pill(v.status,v.status==='Disponível'?'green':v.status==='Indisponível'?'red':'blue')}</td><td>${pill(...inspectionStatus(v))}</td><td><button class="btn secondary small" onclick="vehicleModal('${v.id}')">Editar</button> <button class="btn secondary small" onclick="vehicleDetail('${v.id}')">Ficha</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Sem veículos. Clique em + Veículo para cadastrar.</td></tr>'}</tbody></table></div></div>`}
function vehicleModal(id){let v=id?vehicle(id):{};openModal(`<h2>${id?'Editar':'Cadastrar'} veículo</h2><div class="form-grid">${f('v_plate','Placa *',v.plate||'')}${f('v_model','Modelo / versão *',v.model||'')}${f('v_year','Ano',v.year||'','number')}${f('v_asset','Patrimônio / prefixo',v.asset||'')}${f('v_km','Quilometragem',v.km||'','number')}${f('v_team','Equipe / setor',v.team||'Infraestrutura')}<label>Condutor atual<select id="v_driver">${opts(state.drivers,v.driverId,'Sem condutor')}</select></label><label>Situação<select id="v_status">${['Em utilização','Disponível','Indisponível','Aguardando recebimento'].map(x=>`<option ${v.status===x?'selected':''}>${x}</option>`).join('')}</select></label><div class="wide">${fileInput('v_crlv','CRLV-e (foto / PDF)',v.crlv)}</div><div class="wide">${fileInput('v_card','Cartão de abastecimento — não fotografe números completos ou códigos',v.card)}</div>${f('v_cardVendor','Operadora / cartão (identificação não sensível)',v.cardVendor||'')} ${f('v_crlvYear','Exercício do CRLV',v.crlvYear||'')}${f('v_reviewDate','Próxima revisão (data)',v.reviewDate||'','date')}${f('v_reviewKm','Próxima revisão (km)',v.reviewKm||'','number','min="0"')}${f('v_licenseDate','Prazo do licenciamento',v.licenseDate||'','date')}<label>Inventário de acessórios<textarea id="v_inventory">${h(v.inventory||'')}</textarea></label><label class="wide">Observações<textarea id="v_notes">${h(v.notes||'')}</textarea></label></div><div class="flex space"><button class="btn" onclick="saveVehicle('${id||''}')">Salvar veículo</button><button class="btn secondary" onclick="closeModal()">Cancelar</button></div>`)}
async function saveVehicle(id){let plate=$('v_plate').value.trim().toUpperCase(),model=$('v_model').value.trim();if(!plate||!model)return notify('Informe placa e modelo.');if(state.vehicles.some(v=>v.plate===plate&&v.id!==id))return notify('Essa placa já está cadastrada.');try{let old=id?vehicle(id):{},crlv=await imageFromInput('v_crlv',old.crlv),card=await imageFromInput('v_card',old.card);let data={...old,id:id||uid(),plate,model,year:$('v_year').value,asset:$('v_asset').value,km:$('v_km').value,team:$('v_team').value,driverId:$('v_driver').value,status:$('v_status').value,crlv,card,cardVendor:$('v_cardVendor').value,crlvYear:$('v_crlvYear').value,reviewDate:$('v_reviewDate').value,reviewKm:$('v_reviewKm').value,licenseDate:$('v_licenseDate').value,inventory:$('v_inventory').value,notes:$('v_notes').value};if(id)state.vehicles=state.vehicles.map(v=>v.id===id?data:v);else state.vehicles.push(data);await save();closeModal();render();notify('Veículo salvo.')}catch(e){notify('Erro ao salvar: '+e.message)}}
function vehicleDetail(id){let v=vehicle(id);openModal(`<h2>${h(v.plate)} · ${h(v.model)}</h2><p>Equipe: ${h(v.team||'—')} · Condutor: ${h(driver(v.driverId)?.name||'Não vinculado')} · KM: ${h(v.km||'—')}</p><p>Checklist: ${pill(...inspectionStatus(v))} · Situação: ${pill(v.status)}</p><h3>Manutenção e inventário</h3><p>Próxima revisão: ${displayDate(v.reviewDate)} / ${h(v.reviewKm||'—')} km · Licenciamento: ${displayDate(v.licenseDate)}</p><p>${h(v.inventory||'Inventário não cadastrado')}</p><h3>Pendências e movimentações</h3>${state.issues.filter(x=>x.vehicleId===id).map(x=>`<p>${h(x.item)} · ${h(x.status)} · ${h(x.priority||'Não classificada')}</p>`).join('')}${state.handovers.filter(x=>x.vehicleId===id).map(x=>`<p>${displayDate(x.date)} · ${h(x.reason)} · ${h(x.from)}</p>`).join('')}<h3>Documentos registrados</h3><p>CRLV: ${v.crlv?'Anexo presente':'Não anexado'} · Cartão de abastecimento: ${v.card?'Anexo presente':'Não anexado'}</p>${v.crlv?.startsWith('data:image/')?`<img class="image-preview" src="${fleetMedia(v.crlv)}">`:''}${v.card?.startsWith('data:image/')?`<img class="image-preview" src="${fleetMedia(v.card)}">`:''}<h3 class="space">Histórico de inspeções</h3>${state.inspections.filter(i=>i.vehicleId===id).sort((a,b)=>b.date.localeCompare(a.date)).map(i=>`<div class="card-row"><span>${displayDate(i.date)} · ${h(i.type)}</span><button class="btn secondary small" onclick="printInspection('${i.id}')">PDF / Imprimir</button></div>`).join('')||'<div class="help">Nenhum checklist realizado.</div>'}<div class="flex space"><button class="btn secondary" onclick="vehicleModal('${id}')">Editar cadastro</button><button class="btn" onclick="closeModal();go('inspections');inspectionModal('${id}')">Novo checklist</button></div>`)}
function driversScreen(){$('main').innerHTML=`<div class="panel"><h2>Motoristas e validade da CNH</h2><div class="table-wrap"><table><thead><tr><th>Condutor</th><th>CNH</th><th>Categoria</th><th>Validade</th><th>Alerta</th><th>Ações</th></tr></thead><tbody>${state.drivers.map(d=>`<tr><td><b>${h(d.name)}</b><div class="help">${h(d.employee||'')}</div></td><td>${d.license?'••••'+h(d.license.slice(-3)):'—'}</td><td>${h(d.category||'—')}</td><td>${displayDate(d.expiry)}</td><td>${pill(...licenseStatus(d))}</td><td><button class="btn secondary small" onclick="driverModal('${d.id}')">Editar</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhum condutor cadastrado.</td></tr>'}</tbody></table></div><p class="help">Validade é um alerta cadastral. A gestão deve conferir também categoria, autenticidade, eventuais restrições e normas aplicáveis.</p></div>`}
function driverModal(id){let d=id?driver(id):{};openModal(`<h2>${id?'Editar':'Cadastrar'} condutor</h2><div class="form-grid">${f('d_name','Nome do motorista *',d.name||'')}${f('d_employee','Matrícula / identificação',d.employee||'')}${f('d_license','Número da CNH',d.license||'')}<label>Categoria<select id="d_category">${['','A','B','AB','C','D','E','AC','AD','AE'].map(x=>`<option ${d.category===x?'selected':''}>${x}</option>`).join('')}</select></label>${f('d_expiry','Validade da CNH',d.expiry||'','date')}<label>Conferência documental<select id="d_verified"><option value="pendente" ${d.verified==='pendente'?'selected':''}>Pendente</option><option value="conferido" ${d.verified==='conferido'?'selected':''}>Conferida por responsável</option></select></label><div class="wide">${fileInput('d_photo','CNH (foto ou PDF fictício)',d.photo)}</div></div><div class="flex space"><button class="btn" onclick="saveDriver('${id||''}')">Salvar condutor</button><button class="btn secondary" onclick="closeModal()">Cancelar</button></div>`)}
async function saveDriver(id){let name=$('d_name').value.trim();if(!name)return notify('Informe o nome do motorista.');try{let old=id?driver(id):{},data={...old,id:id||uid(),name,employee:$('d_employee').value,license:$('d_license').value,category:$('d_category').value,expiry:$('d_expiry').value,verified:$('d_verified').value,photo:await imageFromInput('d_photo',old.photo)};if(id)state.drivers=state.drivers.map(d=>d.id===id?data:d);else state.drivers.push(data);await save();closeModal();render();notify('Condutor salvo.')}catch(e){notify('Erro ao salvar: '+e.message)}}
function inspectionsScreen(){$('main').innerHTML=`<div class="panel"><div class="flex between"><h2>Histórico de checklists</h2><span class="help">Semanal · Quinzenal · Férias · Transferência · Extraordinário</span></div><div class="table-wrap"><table><thead><tr><th>Data</th><th>Veículo</th><th>Condutor</th><th>Tipo</th><th>Não conformidades</th><th>Relatório</th></tr></thead><tbody>${state.inspections.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(i=>`<tr><td>${displayDate(i.date)}</td><td>${h(i.plate||vehicle(i.vehicleId)?.plate)}</td><td>${h(i.driverName||driver(i.driverId)?.name||'—')}</td><td>${h(i.type)}</td><td>${pill(String(i.failures||0),i.failures?'red':'green')}</td><td><button class="btn secondary small" onclick="printInspection('${i.id}')">Ver / PDF</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhuma inspeção registrada.</td></tr>'}</tbody></table></div></div>`}
function inspectionModal(prefVehicle){if(!state.vehicles.length)return notify('Cadastre pelo menos um veículo antes do checklist.');let selected=prefVehicle||state.vehicles[0].id;let v=vehicle(selected),id='inspection-editor';openModal(`<h2>Novo checklist veicular</h2><div class="form-grid"><label>Veículo *<select id="i_vehicle" onchange="inspectionVehicleChange()">${opts(state.vehicles.map(x=>({id:x.id,name:x.plate+' · '+x.model})),selected)}</select></label><label>Condutor *<select id="i_driver" onchange="driverSummary()">${opts(state.drivers,v.driverId,'Selecione motorista')}</select></label><label>Tipo de inspeção<select id="i_type" onchange="inspectionTypeChanged()"><option value="semanal">Semanal</option><option value="quinzenal">Quinzenal (exceção)</option><option value="ferias">Devolução por férias</option><option value="transferencia">Entrega / transferência</option><option value="extraordinario">Extraordinário</option></select></label>${f('i_date','Data *',today(),'date')}${f('i_km','Quilometragem *',v.km||'','number')}${f('i_fuel','Combustível (aprox. %)', '', 'number','min="0" max="100"')}<label class="wide hide" id="extension-label">Justificativa obrigatória para inspeção quinzenal<textarea id="i_reason" placeholder="Explique por que a inspeção semanal não foi possível"></textarea></label></div><p class="alert">Verifique documento do carro, cartão de abastecimento e CNH na seção correspondente. Se houver não conformidade, registre observação e evidência.</p><div class="section-label">Condutor e evidências obrigatórias</div><div id="driver-summary" class="muted-bg"></div><div class="form-grid">${evidenceFields.map(([k,l])=>`<label>${l} *<input id="ev_${k}" type="file" accept="image/*"><span id="evhint_${k}" class="small-muted"></span></label>`).join('')}</div><div id="prior-issues" class="space"></div><div id="check-groups">${CHECK_GROUPS.map(([title,items],g)=>`<div class="section-label">${h(title)}</div>${items.map((item,j)=>{let k=`${g}-${j}`;return `<div class="check-row"><b>${h(item)}</b><div><select id="st_${k}" onchange="checkStatusChange('${k}')"><option value="">Selecionar resultado</option><option value="Conforme">Conforme</option><option value="Não conforme">Não conforme</option><option value="Não se aplica">Não se aplica</option></select><div id="extra_${k}" class="hide space"><textarea id="note_${k}" placeholder="Descreva o problema ou observação"></textarea><input type="file" accept="image/*" id="photo_${k}" capture="environment"><div class="small-muted">Foto da avaria (obrigatória em item não conforme)</div></div></div></div>`}).join('')}`).join('')}</div><label class="space">Observações gerais<textarea id="i_notes"></textarea></label><div class="flex space"><button class="btn" onclick="saveInspection()">Concluir checklist</button><button class="btn secondary" onclick="cancelInspection()">Cancelar checklist</button><button class="btn secondary" onclick="saveDraft()">Salvar rascunho</button></div>`,id);restoreDraft(selected);driverSummary();priorIssues();$('overlay').querySelector('.modal').addEventListener('input',scheduleDraft);$('overlay').querySelector('.modal').addEventListener('change',scheduleDraft)}
function inspectionVehicleChange(){let v=vehicle($('i_vehicle').value);if(v){$('i_km').value=v.km||'';$('i_driver').value=v.driverId||'';driverSummary();priorIssues()}}
function inspectionTypeChanged(){$('extension-label').classList.toggle('hide',$('i_type').value!=='quinzenal')}
function checkStatusChange(k){$('extra_'+k).classList.toggle('hide',$('st_'+k).value!=='Não conforme')}
async function saveInspection(){let vehicleId=$('i_vehicle').value,driverId=$('i_driver').value,type=$('i_type').value,date=$('i_date').value,km=Number($('i_km').value),reason=$('i_reason').value.trim();if(!vehicleId||!driverId||!date||!$('i_km').value)return notify('Informe veículo, motorista, data e quilometragem.');if(date>today())return notify('A data da inspeção não pode estar no futuro.');if(type==='quinzenal'&&!reason)return notify('Informe justificativa para a periodicidade quinzenal.');if(!Number.isFinite(km)||km<0)return notify('Quilometragem inválida.');let prev=Number(vehicle(vehicleId)?.km||0);if(prev&&km<prev&&!confirm('Quilometragem menor que a registrada anteriormente. Confirma?'))return;
let answers=[],photos={};for(let g=0;g<CHECK_GROUPS.length;g++){for(let j=0;j<CHECK_GROUPS[g][1].length;j++){let k=`${g}-${j}`,status=$('st_'+k).value;if(!status)return notify('Responda todos os itens do checklist.');let note=status==='Não conforme'?$('note_'+k).value.trim():'';let file=status==='Não conforme'?$('photo_'+k).files[0]:null;if(status==='Não conforme'&&!note)return notify('Descreva todas as não conformidades.');if(status==='Não conforme'&&!file&&!draftFiles['photo_'+k])return notify('Anexe uma foto para cada item não conforme.');answers.push({section:CHECK_GROUPS[g][0],item:CHECK_GROUPS[g][1][j],status,note,k});}}
try{let evidence={};for(const [k,l] of evidenceFields){evidence[k]=await imageFromInput('ev_'+k,draftFiles['ev_'+k]||'');if(!evidence[k])return notify('Anexe: '+l)}for(const a of answers){if(a.status==='Não conforme')photos[a.k]=await imageFromInput('photo_'+a.k,draftFiles['photo_'+a.k]||'')}
let v=vehicle(vehicleId),d=driver(driverId);let record={id:uid(),vehicleId,plate:v.plate,driverId,driverName:d?.name||'',type,date,km,fuel:$('i_fuel').value,reason,extended:type==='quinzenal',answers,photos,evidence,driverSnapshot:{name:d?.name,category:d?.category,expiry:d?.expiry,license:d?.license},notes:$('i_notes').value,failures:answers.filter(x=>x.status==='Não conforme').length,createdAt:new Date().toISOString()};state.inspections.push(record);v.km=String(km);for(const a of answers.filter(x=>x.status==='Não conforme')){let existing=state.issues.find(x=>x.vehicleId===vehicleId&&x.item===a.item&&x.status!=='Resolvida');if(existing){(existing.recurrences??=[]).push({inspectionId:record.id,date,description:a.note,photo:photos[a.k]});continue}state.issues.push({id:uid(),vehicleId,plate:v.plate,inspectionId:record.id,item:a.item,description:a.note,photo:photos[a.k],date,status:'Aberta',resolution:''});}clearDraft();closeModal();render();notify('Checklist concluído e pendências registradas.')}catch(e){notify('Erro ao salvar: '+e.message)}}
function issuesScreen(){$('main').innerHTML=`<div class="panel"><h2>Avarias registradas</h2><div class="table-wrap"><table><thead><tr><th>Veículo</th><th>Data</th><th>Item</th><th>Descrição</th><th>Status</th><th>Ação</th></tr></thead><tbody>${state.issues.slice().reverse().map(x=>`<tr><td>${h(x.plate)}</td><td>${displayDate(x.date)}</td><td>${h(x.item)}</td><td>${h(x.description)}</td><td>${pill(x.status,x.status==='Resolvida'?'green':'yellow')}</td><td><button class="btn secondary small" onclick="issueModal('${x.id}')">Acompanhar</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhuma avaria registrada.</td></tr>'}</tbody></table></div></div>`}
function issueModal(id){let x=state.issues.find(v=>v.id===id);openModal(`<h2>Avaria · ${h(x.plate)}</h2><p><b>${h(x.item)}</b> · ${displayDate(x.date)}</p><p>${h(x.description)}</p>${x.photo?.startsWith('data:image/')?`<img class="image-preview" src="${fleetMedia(x.photo)}">`:''}<div class="form-grid space"><label>Status<select id="is_status"><option ${x.status==='Aberta'?'selected':''}>Aberta</option><option ${x.status==='Em análise'?'selected':''}>Em análise</option><option ${x.status==='Em manutenção'?'selected':''}>Em manutenção</option><option ${x.status==='Resolvida'?'selected':''}>Resolvida</option></select></label><label>Responsável pelo tratamento<input id="is_owner" value="${h(x.owner||'')}"></label><label>Prioridade<select id="is_priority">${['Baixa','Moderada','Crítica'].map(p=>`<option ${x.priority===p?'selected':''}>${p}</option>`).join('')}</select></label>${f('is_due','Prazo de ação',x.due||'','date')}<label class="wide">Ação planejada<textarea id="is_action">${h(x.action||'')}</textarea></label><div class="wide">${fileInput('is_proof','Evidência da solução',x.resolutionPhoto)}</div><label class="wide">Resolução / encaminhamento<textarea id="is_resolution">${h(x.resolution||'')}</textarea></label></div><div class="flex space"><button class="btn" onclick="saveIssue('${id}')">Salvar acompanhamento</button></div>`)}
async function saveIssue(id){let x=state.issues.find(i=>i.id===id);if($('is_status').value==='Resolvida'&&!$('is_resolution').value.trim())return notify('Informe a solução realizada.');try{x.resolutionPhoto=await imageFromInput('is_proof',x.resolutionPhoto)}catch(e){return notify(e.message)}x.priority=$('is_priority').value;x.due=$('is_due').value;x.action=$('is_action').value;x.status=$('is_status').value;if(x.priority==='Crítica'&&x.status!=='Resolvida'){let v=vehicle(x.vehicleId);if(v)v.status='Indisponível'}x.owner=$('is_owner').value;x.resolution=$('is_resolution').value;x.updatedAt=new Date().toISOString();await save();closeModal();render();notify('Avaria atualizada.')}
function handoversScreen(){$('main').innerHTML=`<div class="panel"><h2>Devolução por férias e transferência de responsabilidade</h2><div class="table-wrap"><table><thead><tr><th>Data</th><th>Veículo</th><th>Motivo</th><th>Entregue por</th><th>Recebido por</th><th>Situação</th><th>Ação</th></tr></thead><tbody>${state.handovers.slice().reverse().map(x=>`<tr><td>${displayDate(x.date)}</td><td>${h(x.plate)}</td><td>${h(x.reason)}</td><td>${h(x.from)}</td><td>${h(x.confirmedBy||'—')}</td><td>${pill(x.confirmed?'Recebido':'Aguardando',x.confirmed?'green':'yellow')}</td><td><button class="btn secondary small" onclick="handoverDetail('${x.id}')">${x.confirmed?'Visualizar':'Confirmar'}</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhuma devolução registrada.</td></tr>'}</tbody></table></div></div>`}
function handoverModal(){if(!state.vehicles.length)return notify('Cadastre um veículo antes de registrar devolução.');openModal(`<h2>Nova entrega / devolução</h2><div class="form-grid"><label>Veículo *<select id="h_vehicle">${opts(state.vehicles.map(v=>({id:v.id,name:v.plate+' · '+v.model})),'')}</select></label><label>Motivo<select id="h_reason"><option>Férias</option><option>Troca de condutor</option><option>Remanejamento de equipe</option><option>Manutenção</option><option>Outra devolução</option></select></label>${f('h_date','Data *',today(),'date')}${f('h_km','Quilometragem *','','number')}${f('h_from','Entregue por *')}${f('h_fuel','Combustível (aprox. %)','','number','min="0" max="100"')}<label class="wide">Conferências da entrega<div class="flex"><label><input type="checkbox" id="h_keys"> Chaves</label><label><input type="checkbox" id="h_crlv"> Documento CRLV-e</label><label><input type="checkbox" id="h_card"> Cartão abastecimento</label><label><input type="checkbox" id="h_tools"> Ferramentas / acessórios</label></div></label><div class="wide">${fileInput('h_photo','Foto do estado do veículo na devolução (recomendada)')}</div><label class="wide">Avarias / ressalvas<textarea id="h_notes"></textarea></label></div><p class="help">Esta confirmação não substitui o checklist de inspeção; em devolução por férias, faça também a inspeção específica na aba Checklists.</p><div class="flex space"><button class="btn" onclick="saveHandover()">Registrar devolução</button></div>`)}
async function saveHandover(){let vehicleId=$('h_vehicle').value,from=$('h_from').value.trim(),km=$('h_km').value,date=$('h_date').value;if(!vehicleId||!from||!km||!date)return notify('Preencha veículo, condutor, km e data.');try{let v=vehicle(vehicleId);state.handovers.push({id:uid(),vehicleId,plate:v.plate,reason:$('h_reason').value,date,km,from,fuel:$('h_fuel').value,checks:{keys:$('h_keys').checked,crlv:$('h_crlv').checked,card:$('h_card').checked,tools:$('h_tools').checked},photo:await imageFromInput('h_photo',''),notes:$('h_notes').value,confirmed:false});v.status='Aguardando recebimento';v.driverId='';await save();closeModal();render();notify('Devolução registrada. Aguardando recebimento.')}catch(e){notify('Erro ao salvar: '+e.message)}}
function handoverDetail(id){let x=state.handovers.find(o=>o.id===id);openModal(`<h2>${h(x.plate)} · ${h(x.reason)}</h2><p>Entregue por: <b>${h(x.from)}</b> · ${displayDate(x.date)} · ${h(x.km)} km</p><p>Itens conferidos: ${Object.entries(x.checks).map(([k,v])=>`${h(({keys:'Chaves',crlv:'CRLV-e',card:'Cartão',tools:'Ferramentas'})[k])}: ${v?'Sim':'Não'}`).join(' · ')}</p>${x.notes?`<p>Ressalvas: ${h(x.notes)}</p>`:''}${x.photo?.startsWith('data:image/')?`<img class="image-preview" src="${fleetMedia(x.photo)}">`:''}${x.confirmed?`<div class="alert">Recebido por ${h(x.confirmedBy)} (${h(x.confirmedRole)}) em ${new Date(x.confirmedAt).toLocaleString('pt-BR')}.</div>`:`<div class="section-label">Confirmar recebimento</div><div class="form-grid">${f('confirm_name','Nome de quem recebeu *')}<label>Perfil autorizado<select id="confirm_role"><option>Gestão da Infraestrutura</option><option>Outro condutor autorizado</option><option>Responsável pela frota</option></select></label><label class="wide">Observações da conferência<textarea id="confirm_notes"></textarea></label></div><div class="flex space"><button class="btn" onclick="confirmHandover('${id}')">Confirmar recebimento</button></div>`}`)}
async function confirmHandover(id){let name=$('confirm_name').value.trim();if(!name)return notify('Informe quem está confirmando o recebimento.');let x=state.handovers.find(o=>o.id===id);x.confirmed=true;x.confirmedBy=name;x.confirmedRole=$('confirm_role').value;x.confirmNotes=$('confirm_notes').value;x.confirmedAt=new Date().toISOString();let v=vehicle(x.vehicleId);if(v)v.status='Disponível';await save();closeModal();render();notify('Recebimento confirmado.')}
function reportsScreen(){$('main').innerHTML=`<div class="panel"><h2>Relatórios de inspeção</h2><div class="flex"><button class="btn secondary small" onclick="exportCSV()">Exportar checklists (CSV / Excel)</button></div><p class="help">Abra o relatório e escolha “Salvar como PDF” no diálogo de impressão do navegador.</p>${state.inspections.slice().reverse().map(i=>`<div class="card-row"><div><b>${h(i.plate)} · ${displayDate(i.date)}</b><div class="help">${h(i.type)} · ${h(i.driverName)} · ${i.failures} não conformidade(s)</div></div><button class="btn secondary small" onclick="printInspection('${i.id}')">Gerar PDF</button></div>`).join('')||'<div class="empty">Ainda não há relatórios. Conclua um checklist para gerar um.</div>'}</div>`}
