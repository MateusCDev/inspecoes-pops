function reuseInventory22(){
 const r=cur();if(!r){return}const old=previousInventory22(r);
 if(!old){alert('Não foi encontrada uma inspeção FINALIZADA com o mesmo nome/código da estação neste navegador. É necessário um cadastro anterior ou a futura API corporativa.');return}
 const occupied=(r.inventory||[]).length+(r.invTransceivers||[]).length+(r.invBatteryBanks||[]).length+Object.values(r.equipamentos||{}).reduce((a,x)=>a+(Array.isArray(x)?x.length:0),0);
 if(!confirm(`Copiar o cadastro da estação “${old.nome}” (inspeção de ${fmt(old.data)})?\n\nO inventário atual${occupied?' será SUBSTITUÍDO':' está vazio'}. Fotos, medições, checklist e OS da inspeção anterior NÃO serão copiados.\n\nFonte: registro local, não validado pelo servidor.`))return;
 const clone=v=>JSON.parse(JSON.stringify(v||[]));
 r.inventory=clone(old.inventory);r.invTransceivers=clone(old.invTransceivers);r.invBatteryBanks=clone(old.invBatteryBanks);
 const prev=old.equipamentos||{};r.equipamentos={retificadoras:clone(prev.retificadoras),bancos:clone(prev.bancos),climatizadores:clone(prev.climatizadores),dios:clone(prev.dios)};
 for(const key of ['ocupacao','parceiroOcupacao','contatoOcupacao','horarioAcesso','restricoesAcesso'])if(!r[key])r[key]=old[key]||'';
 r.inventorySource={id:old.id,station:old.nome,date:old.data,copiedAt:new Date().toISOString()};
 r.inventoryReview={};r.batteryReview={};change();render();alert('Inventário reutilizado. Confira os grupos e cada bateria antes de finalizar. Fotos e checklist continuam específicos desta vistoria.');
}
function loadAll(){try{const key=window.VOANET_SYNC_CONFIG?.mode==='google'?googleStorageKey():STORAGE;return key?(JSON.parse(localStorage.getItem(key))||[]):[]}catch(e){return []}}
function saveAll(){if(localSaveTimer!==null){clearTimeout(localSaveTimer);localSaveTimer=null;}try{const key=window.VOANET_SYNC_CONFIG?.mode==='google'?googleStorageKey():STORAGE;if(!key)return false;localStorage.setItem(key,JSON.stringify(records));const status=document.getElementById('save');if(status)status.textContent='Salvo neste dispositivo';return true}catch(e){alert('Não foi possível salvar neste navegador. Exporte o arquivo JSON e libere espaço no dispositivo.');return false}}
function cur(){return records.find(r=>r.id===activeId)}

function queueLocalSave(){if(localSaveTimer!==null)clearTimeout(localSaveTimer);localSaveTimer=setTimeout(()=>{localSaveTimer=null;saveAll();},400)}

function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function txt(v){return esc(v).replace(/\n/g,'<br>')}
function fmt(v){if(!v)return '—';if(/^\d{4}-\d{2}-\d{2}$/.test(String(v))){const [y,m,d]=String(v).split('-');return d+'/'+m+'/'+y}try{return new Date(v).toLocaleDateString('pt-BR')}catch(e){return String(v)}}
function completed(r){return groups.reduce((n,g)=>n+g.items.filter(([c])=>r.checks[c]&&r.checks[c].status&&r.checks[c].status!=='NV').length,0)+(r.interligacoes?.status&&r.interligacoes.status!=='NV'?1:0)}
function totalChecks(){return 1+groups.reduce((n,g)=>n+g.items.length,0)}
function ncCount(r){return Object.values(r.checks).filter(c=>c.status==='NC').length+(r.interligacoes?.status==='NC'?1:0)}

// Cronograma local de preventivas: nenhuma inspeção é contabilizada como recebida pelo servidor sem confirmação.
const ALERT_DAYS=15;
let dashboardFilter='todos';
function localToday(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dateLocal(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso||'')))return null;const [y,m,d]=iso.split('-').map(Number);const v=new Date(y,m-1,d,12);return v.getFullYear()===y&&v.getMonth()===m-1&&v.getDate()===d?v:null}
function addLocalDays(iso,days){const d=dateLocal(iso);if(!d)return '';d.setDate(d.getDate()+Number(days));return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function inspectionDate(r){return r.finalizedAt?((r.finalizedAt||'').slice(0,10)):r.data||''}
function deriveSchedule(r){if(isGoogleMode()){const station=googleStation(r);return station?.days?addLocalDays(r.data,station.days):'';}const n=Number(r.schedulePeriod);if(![30,90,180].includes(n))return '';const base=r.scheduleBaseDate||inspectionDate(r);return addLocalDays(base,n)}
function daysUntil(date){const due=dateLocal(date),today=dateLocal(localToday());return due?Math.round((due-today)/86400000):null}
function scheduleState(r){const due=r.scheduleDueDate||deriveSchedule(r);if(!r.finalizedAt||!due)return {key:'sem',label:'Sem programação',className:'schedule-gray',due:'',delta:null};const delta=daysUntil(due);if(delta===null)return {key:'sem',label:'Sem programação',className:'schedule-gray',due:'',delta:null};if(delta<0)return {key:'vencida',label:'Vencida há '+Math.abs(delta)+' dia(s)',className:'schedule-red',due,delta};if(delta===0)return {key:'alerta',label:'Vence hoje',className:'schedule-yellow',due,delta};if(delta<=ALERT_DAYS)return {key:'alerta',label:'Vence em '+delta+' dia(s)',className:'schedule-yellow',due,delta};return {key:'em-dia',label:'Em dia',className:'schedule-green',due,delta}}
function nameKey(r){return String(r.nome||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/\s+/g,' ')||r.id}
function stationSummaries(source=records){const map=new Map();for(const r of source){const k=nameKey(r);if(!map.has(k))map.set(k,[]);map.get(k).push(r)}return [...map.values()].map(rs=>{const dated=rs.filter(x=>x.finalizedAt);const final=dated.sort((a,b)=>String(b.finalizedAt).localeCompare(String(a.finalizedAt)))[0];const fallback=rs.slice().sort((a,b)=>String(b.updated).localeCompare(String(a.updated)))[0];const item=final||fallback;return {r:item,state:scheduleState(item),history:rs.length}}).sort((a,b)=>{const order={vencida:0,alerta:1,sem:2,'em-dia':3};return order[a.state.key]-order[b.state.key]||String(a.state.due).localeCompare(String(b.state.due))||String(a.r.nome).localeCompare(String(b.r.nome))})}
function scheduleChip(st){return `<span class="schedule-chip ${st.className}">${esc(st.label)}</span>`}
function scheduleForm(r){if(isGoogleMode())return googleScheduleForm(r);const period=String(r.schedulePeriod||'');const due=deriveSchedule(r);return `<div class="card"><h2>Próxima inspeção preventiva</h2><p class="muted small">Selecione 30, 90 ou 180 dias. A contagem definitiva começa na data de finalização desta inspeção. O prazo sugerido deve seguir a criticidade da estação e as orientações da coordenação.</p><div class="grid"><div class="field"><label>Periodicidade da próxima inspeção</label><select data-schedule-period><option value="" ${!period?'selected':''}>Selecionar prazo</option>${[30,90,180].map(n=>`<option value="${n}" ${period===String(n)?'selected':''}>${n} dias</option>`).join('')}</select></div><div class="field"><label>Data prevista (cálculo automático)</label><input type="text" readonly value="${esc(due?fmt(due):'Selecione uma periodicidade')}" aria-label="Próxima inspeção prevista"></div><div class="field full"><label>Observação sobre o cronograma</label><textarea data-schedule-notes placeholder="Justificativa do prazo ou orientação da coordenação">${esc(r.scheduleNotes||'')}</textarea></div></div><p><b>Prazo da estação:</b> ${scheduleChip(scheduleState(r))}</p><p class="muted small">Após finalizar, a data e a periodicidade seguem no relatório e no JSON. Os alertas desta versão são visuais, exibidos ao abrir o aplicativo; notificações automáticas em segundo plano dependem do servidor e de um serviço de agendamento.</p></div>`}

// ===== v1.9: Inventário de ativos ópticos e bancos de baterias =====
function inv13(r){if(!Array.isArray(r.invTransceivers))r.invTransceivers=[];if(!Array.isArray(r.invBatteryBanks))r.invBatteryBanks=[];for(const b of r.invBatteryBanks){if(!Array.isArray(b.baterias))b.baterias=[]}return r}
function inv13Id(prefix){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function lifeData(b){
 const install=b.instalacao, years=Number(b.vidaAnos);
 if(!install||!Number.isFinite(years)||years<=0)return {key:'sem',label:'Sem programação',days:null,due:''};
 const parts=install.split('-').map(Number);
 if(parts.length!==3||!parts.every(Number.isFinite))return {key:'sem',label:'Data inválida',days:null,due:''};
 const [y,m,d]=parts, t=new Date(y,m-1,d,12,0,0);if(t.getFullYear()!==y||t.getMonth()!==m-1||t.getDate()!==d)return {key:'sem',label:'Data inválida',days:null,due:''};
 const due=new Date(y+Math.floor(years),m-1,d,12,0,0);
 if(due.getMonth()!==m-1)due.setDate(0); // 29/02: último dia de fevereiro no ano não bissexto
 const now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);
 const diff=Math.round((due-today)/86400000);
 const iso=due.getFullYear()+'-'+String(due.getMonth()+1).padStart(2,'0')+'-'+String(due.getDate()).padStart(2,'0');
 const warn=Math.max(1,Number(b.alertaDias)||90);
 if(diff<0)return {key:'vencida',label:'Prazo ultrapassado ('+(-diff)+' dias)',days:diff,due:iso};
 if(diff<=warn)return {key:'alerta',label:diff===0?'Limite previsto para hoje':'Próxima do limite ('+diff+' dias)',days:diff,due:iso};
 return {key:'em-dia',label:'Dentro do prazo ('+diff+' dias)',days:diff,due:iso};
}

function captureGps(){
 const r=cur();if(!r)return;
 const inform=t=>{const el=document.getElementById('gpsMessage');if(el)el.textContent=t};
 if(!('geolocation' in navigator)){inform('GPS indisponível neste dispositivo. Preencha as coordenadas manualmente.');return}
 if(!window.isSecureContext){inform('Para usar a localização automática, abra o aplicativo em HTTPS. O preenchimento manual está disponível.');return}
 inform('Solicitando permissão para obter a localização…');
 navigator.geolocation.getCurrentPosition(pos=>{
   if(cur()?.id!==r.id)return;
   r.latitude=pos.coords.latitude.toFixed(6);r.longitude=pos.coords.longitude.toFixed(6);
   r.precisaoGps=Number.isFinite(pos.coords.accuracy)?Math.round(pos.coords.accuracy):null;
   r.obtidaGpsEm=new Date(pos.timestamp||Date.now()).toISOString();
   change();render();
   inform('Localização capturada. Precisão aproximada: '+(r.precisaoGps??'não informada')+' m. Confira no mapa.');
 },err=>{
  const reason=err.code===1?'Permissão negada.':err.code===2?'Localização indisponível.':'Tempo limite excedido.';
  inform(reason+' Informe latitude e longitude manualmente.');
 },{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}

ataUltima?'Planilha e circuitos declarados conformes, com responsável e data registrados. Conferir procedimento de aprovação da operação.':'Documentação ainda não liberada para ser considerada validada por este checklist. Conferir e regularizar as divergências antes de novas ativações, conforme procedimento interno.'}</div></div>`}

function compressImage(file){return new Promise((resolve,reject)=>{const img=new Image();const src=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(src);const s=Math.min(1,1500/Math.max(img.width,img.height));let canvas=document.createElement('canvas');canvas.width=Math.round(img.width*s);canvas.height=Math.round(img.height*s);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('Falha ao gerar imagem')),'image/jpeg',.78)};img.onerror=()=>{URL.revokeObjectURL(src);reject(new Error('Arquivo de imagem inválido'))};img.src=src})}
async function fileToDataUrl(blob){return new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=fail;r.readAsDataURL(blob)})}
async function addPhotos(files,target=''){ let r=cur();if(!r)return;const ref=r.id;const el=document.getElementById('photoProcessing');if(!files.length)return;const available=Math.max(0,100-r.photos.length);if(files.length>available)alert('O limite é de 100 fotos por inspeção. Serão adicionadas somente '+available+' foto(s).');let errors=0;for(let i=0;i<files.length&&r.photos.length<100;i++){if(el)el.textContent=`Processando ${i+1} de ${files.length} fotos...`;try{const blob=await compressImage(files[i]);const id='PH-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);await putPhoto({id,blob});if(ref!==activeId)return;r.photos.push({id,name:files[i].name,category:target?'Item vinculado':'Geral',target,caption:'',created:new Date().toISOString()});change()}catch(e){errors++;console.error(e)}}render();if(errors)alert(`${errors} foto(s) não puderam ser salvas.`)}

function download(content,name,mime){const blob=content instanceof Blob?content:new Blob([content],{type:mime});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),20000)}

 if(!base.startsWith('https://')&&!base.startsWith('http://localhost:'))throw Error('A API deve ser HTTPS.');

 if(response.status===204)return {};

     const f=await getPhoto(p.id);if(!f?.blob)throw Error('Fotografia ausente no dispositivo: '+p.id);
     const form=new FormData();form.append('file',f.blob,(p.name||p.id+'.jpg'));form.append('photoId',p.id);form.append('inspectionId',r.id);
     const res=await internalFetch('/api/v1/inspections/'+encodeURIComponent(r.id)+'/photos',{method:'POST',body:form});
     if(!res.storageKey||res.inspectionId!==r.id||res.photoId!==p.id)throw Error('Servidor não confirmou recebimento da fotografia '+p.id);
     photos.push({...p,remotePath:res.storageKey});
   }
   const payload=JSON.parse(JSON.stringify(r));payload.photos=photos;delete payload.syncState;delete payload.syncedAt;delete payload.syncedOrg;
   const res=await internalFetch('/api/v1/inspections/'+encodeURIComponent(r.id),{method:'PUT',headers:{'Content-Type':'application/json','Idempotency-Key':r.id},body:JSON.stringify({inspectionId:r.id,payload,photoCount:photos.length})});
   if(!res||res.inspectionId!==r.id||res.status!=='received')throw Error('Servidor não confirmou recebimento da inspeção.');
   r.syncState='sincronizado';r.syncedAt=new Date().toISOString();r.syncedOrg='VOANET';r.internalSentBy=oid;saveAll();render();alert('Inspeção e evidências confirmadas pelo servidor.');
 }catch(e){r.syncState='erro';saveAll();render();alert('Envio pendente: '+e.message)}finally{syncBusy=false}
}
async function internalSendPending(){
 if(!internalProfile||!syncUser)return alert('Faça login e aguarde a autorização da API interna.');
 if(!navigator.onLine)return alert('Sem conexão. Inspeções continuam neste dispositivo.');
 const items=records.filter(x=>x.finalizedAt&&x.syncState!=='sincronizado');
 if(!items.length)return alert('Não há inspeções pendentes neste dispositivo.');
 for(const r of items)await internalSendOne(r);
}
async function internalLoadDashboard(){
 if(!internalProfile)return alert('Acesso ainda não autorizado pelo servidor.');
 try{const data=await internalFetch('/api/v1/inspections?limit=200');dashboardData=Array.isArray(data?.items)?data.items:[];render()}
 catch(e){alert('Consulta indisponível: '+e.message)}
}
function syncPanel(r){
 if(isGoogleMode())return googlePanel(r);
 if(isInternalMode())return internalSyncPanel(r);
 if(cfg.mode==='local')return `<div class="card"><h2>Acesso Microsoft corporativo (em preparação)</h2><p class="muted small">Modo local de homologação. O login Microsoft 365 e a sincronização com servidor interno somente serão ativados após configuração e aprovação pelo TI. Inspeções e fotos permanecem neste dispositivo. Exporte um backup JSON.</p><p class="muted small">${records.filter(x=>x.finalizedAt&&x.syncState!=='sincronizado').length} inspeções pendentes de sincronização.</p></div>`;
 const eligible=syncConfigured();
 const pending=records.filter(x=>x.finalizedAt&&x.syncState!=='sincronizado').length;
 const latest= r ? `<p class="small muted">Inspeção atual: ${esc(syncStatusText(r))}</p>` : '';
 const auth=syncUser?`<div class="btnrow"><span class="small muted">Conectado: ${esc(syncUser.email)} | Empresa: ${esc(syncOrg?.name||'não atribuída')}</span>${button('logoutSync','Sair','tiny')}${button('retrySync','Reenviar pendentes ('+pending+')','tiny primary')}${button('loadDashboard','Painel da gestão','tiny')}</div>`:
 `<form id="syncLogin" class="grid" autocomplete="on"><div class="field"><label>E-mail corporativo</label><input type="email" name="email" placeholder="usuario@empresa.com.br" autocomplete="username" required></div><div class="field"><label>Senha</label><input type="password" name="password" autocomplete="current-password" required></div><button class="btn primary" type="submit" ${eligible?'':'disabled'}>Entrar no servidor</button></form>`;
 const dash=dashboardData.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Estação</th><th>Técnico 01</th><th>Finalizada</th><th>NC</th><th>Fotos</th></tr></thead><tbody>${dashboardData.map(row=>`<tr><td>${esc(row.station_name)}</td><td>${esc(row.technician)}</td><td>${esc(row.finished_at?.slice(0,10)||'')}</td><td>${esc(row.nc_count)}</td><td>${esc(row.photo_count)}</td></tr>`).join('')}</tbody></table></div>`:'';
 return `<div class="card"><h2>Servidor corporativo e gestão</h2><p class="muted small">${eligible?'Conexão configurada. O envio requer login e vínculo com a empresa no banco de dados.':'Servidor ainda não configurado. O preenchimento local funciona normalmente.'}</p>${latest}${auth}${dash}<p class="muted small">Registros sincronizados: ${records.filter(x=>x.syncState==='sincronizado').length} · Aguardando envio: ${pending}</p></div>`;
}
async function iniciarSync(){
 if(isGoogleMode())return;
 if(isInternalMode())return initInternal();
 try{
  if(!cfg.supabaseUrl||!cfg.supabasePublishableKey||!window.supabase?.createClient)return;
  sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  const {data:{session}}=await sb.auth.getSession();syncUser=session?.user||null;
  if(syncUser)await identificarEmpresa();
  sb.auth.onAuthStateChange(async(_event,session)=>{syncUser=session?.user||null;syncOrg=null;if(syncUser)await identificarEmpresa();render();});
  render();if(syncUser&&syncOrg&&navigator.onLine)enviarPendentes();
 }catch(e){console.error('Falha inicializando servidor:',e)}
}
async function identificarEmpresa(){
 if(!sb||!syncUser)return;
 const {data,error}=await sb.from('memberships').select('organization_id,role,organizations(id,name)').eq('user_id',syncUser.id);
 if(error){console.error(error);return}
 syncMembers=data||[];
 if(syncMembers.length===1){syncOrg={id:syncMembers[0].organization_id,name:syncMembers[0].organizations?.name,role:syncMembers[0].role};}
 else if(syncMembers.length>1){const chosen=localStorage.getItem('voanet_org_id');const m=syncMembers.find(x=>x.organization_id===chosen)||syncMembers[0];syncOrg={id:m.organization_id,name:m.organizations?.name,role:m.role};localStorage.setItem('voanet_org_id',syncOrg.id)}
}
async function loginSync(form){
 if(!syncConfigured()){alert('Configure o servidor e publique o aplicativo antes de realizar login.');return}
 const f=new FormData(form);const {error}=await sb.auth.signInWithPassword({email:String(f.get('email')),password:String(f.get('password'))});
 if(error){alert('Não foi possível entrar: '+error.message);return}
 await identificarEmpresa();render();if(!syncOrg){alert('Login realizado, mas o TI ainda precisa vincular seu usuário a uma empresa.');return}enviarPendentes();
}
async function sairSync(){if(isGoogleMode()){googleLogout();return;}if(isInternalMode())return internalLogout();if(!sb)return;await sb.auth.signOut();syncUser=null;syncOrg=null;dashboardData=[];render()}
async function finalizarEEnviar(){
 if(isGoogleMode())return googleFinalize();
 const r=cur();if(!r)return;
 if(!r.nome?.trim()||!r.inspetor?.trim()||!r.data){alert('Informe estação, Técnico 01 e data antes de finalizar.');navigate('dados');return}if(![30,90,180].includes(Number(r.schedulePeriod))){alert('Escolha a próxima inspeção: 30, 90 ou 180 dias.');navigate('resumo');return}
 if(!confirm((r.finalizedAt?'Esta inspeção já foi finalizada. Finalizar novamente recalculará o vencimento. Continuar?':'Finalizar a inspeção?')+' O aplicativo salvará o relatório HTML no dispositivo e tentará sincronizar os dados e fotos com o servidor autorizado.'))return;
 r.finalizedAt=new Date().toISOString();r.scheduleBaseDate=localToday();r.scheduleDueDate=deriveSchedule(r);r.syncState='pendente';change();
 try{await report(false)}catch(e){console.error('Relatório não salvo:',e);alert('Falha na criação do relatório. Gere-o manualmente na aba Resumo.')}
 render();
 if(isInternalMode()&&internalProfile&&navigator.onLine){await internalSendOne(r)}
 else if(syncConfigured()&&syncUser&&syncOrg&&navigator.onLine){await enviarUmaInspecao(r)}
 else alert('Inspeção finalizada e pendente de sincronização. Faça login e conecte-se à internet para enviar ao servidor.');
}
async function enviarUmaInspecao(r){
 if(isInternalMode())return internalSendOne(r);
 if(syncBusy||!r?.finalizedAt||!syncConfigured()||!syncUser||!syncOrg)return;
 if(r.syncedOrg&&r.syncedOrg!==syncOrg.id){alert('Esta inspeção foi vinculada a outra empresa; não será enviada para este ambiente.');return}
 syncBusy=true;r.syncState='enviando';saveAll();render();
 try{
  const photoManifest=[];
  for(const p of (r.photos||[])){
   const file=await getPhoto(p.id);
   if(!file?.blob)throw Error(`A fotografia ${p.id} não está disponível neste dispositivo. Importe o backup antes de sincronizar.`);
   const safePhotoId=String(p.id).replace(/[^a-zA-Z0-9_-]/g,'');
   const path=`${syncOrg.id}/${r.id}/${safePhotoId}.jpg`;
   const {error}=await sb.storage.from('inspection-photos').upload(path,file.blob,{contentType:'image/jpeg',upsert:true});
   if(error)throw Error('Falha ao enviar foto: '+error.message);
   photoManifest.push({...p,remotePath:path});
  }
  const payload=JSON.parse(JSON.stringify(r));payload.photos=photoManifest;delete payload.syncState;delete payload.syncedAt;delete payload.syncedOrg;
  const {error}=await sb.from('inspection_records').upsert({id:r.id,organization_id:syncOrg.id,created_by:syncUser.id,station_name:r.nome,technician:r.inspetor,finished_at:r.finalizedAt,nc_count:ncCount(r),photo_count:photoManifest.length,payload},{onConflict:'id'});
  if(error)throw Error('Falha ao salvar a inspeção: '+error.message);
  r.syncState='sincronizado';r.syncedAt=new Date().toISOString();r.syncedOrg=syncOrg.id;saveAll();render();alert('Inspeção e fotos confirmadas no servidor.');
 }catch(e){console.error(e);r.syncState='erro';saveAll();render();alert('Não foi possível sincronizar. Os dados permanecem no celular para reenvio. Motivo: '+e.message)}finally{syncBusy=false}
}
async function enviarPendentes(){
 if(isGoogleMode())return googleSendPending();
 if(isInternalMode())return internalSendPending();
 if(!syncConfigured()||!syncUser||!syncOrg){alert('É necessário configurar o servidor, entrar e estar vinculado a uma empresa.');return}
 if(!navigator.onLine){alert('Sem internet. O envio ficará pendente.');return}
 const list=records.filter(x=>x.finalizedAt&&x.syncState!=='sincronizado');
 if(!list.length){alert('Não existem inspeções pendentes.');return}
 for(const r of list)await enviarUmaInspecao(r);
}
async function carregarPainel(){
 if(isGoogleMode())return openGoogleCentral();
 if(isInternalMode())return internalLoadDashboard();
 if(!syncConfigured()||!syncUser||!syncOrg)return alert('Entre no servidor com um usuário vinculado à empresa.');
 const {data,error}=await sb.from('inspection_records').select('id,station_name,technician,finished_at,nc_count,photo_count,payload').eq('organization_id',syncOrg.id).order('finished_at',{ascending:false}).limit(200);
 if(error)return alert('Falha ao consultar painel: '+error.message);
 dashboardData=data||[];render();
}
document.addEventListener('submit',e=>{if(e.target.id==='syncLogin'){e.preventDefault();loginSync(e.target)}});
window.addEventListener('online',()=>{if(syncUser&&syncOrg)enviarPendentes()});

document.getElementById('goHome').onclick=()=>navigate('home');
